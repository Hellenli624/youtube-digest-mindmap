name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Validate public extension package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build allowlisted ZIP
        run: npm run package

      - name: Show packaged files
        run: unzip -Z1 dist/youtube-digest-v*.zip

  publish:
    name: Publish the packaged ZIP on a version tag
    # Only a v* tag produces a release. Ordinary pushes, pull requests and
    # manual runs stop after the validation job above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build allowlisted ZIP
        run: npm run package

      - name: Check the tag against manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -e 'process.stdout.write(require("./manifest.json").version)')"
          if [ "${tag#v}" != "$version" ]; then
            printf 'Release failed: tag %s does not match manifest.json version %s\n' "$tag" "$version" >&2
            exit 1
          fi

      - name: Create the release and attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/youtube-digest-v*.zip --clobber
          else
            gh release create "$tag" dist/youtube-digest-v*.zip \
              --title "YouTube Digest v${tag#v}" \
              --generate-notes
          fi
